name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-

      # Одним вызовом, а не четырьмя: каждый отдельный `./gradlew --no-daemon`
      # это ещё один холодный старт JVM и ещё один проход конфигурации проекта.
      # Сборка APK оставлена как проверка компиляции, артефакт не выгружается.
      - name: Tests, ktlint, build
        run: ./gradlew testDebugUnitTest ktlintCheck assembleDebug --no-daemon
